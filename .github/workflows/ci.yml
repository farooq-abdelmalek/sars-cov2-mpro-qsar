name: QSAR CI

# Validate changes on the main branch and pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  scientific-validation:
    name: Docker, pytest and Snakemake
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the same container we already tested locally.
      # Load it into Docker so subsequent steps can run it.
      - name: Build scientific environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mpro-qsar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run scientific integrity tests
        run: |
          docker run --rm --network none mpro-qsar:ci \
            .venv/bin/python -m pytest tests/ -v

      - name: Reproduce and verify scientific data
        run: |
          docker run --rm --network none mpro-qsar:ci \
            .workflow-venv/bin/snakemake --cores 1
